services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroguard-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/agroguard
      JWT_ACCESS_SECRET: dev_jwt_access_secret_key_for_local_testing_123456789
      INFERENCE_DRIVER: http
      CLIP_ENABLED: "true"

      CLIP_SERVICE_URL: http://clip-validator:8001
      ENSEMBLE_SERVICE_URL: http://ensemble-inference:8002
      INFERENCE_TIMEOUT_MS: 15000
      STORAGE_DIR: uploads/images
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./uploads/images:/app/uploads/images
    depends_on:
      mongo:
        condition: service_healthy
      clip-validator:
        condition: service_healthy
      ensemble-inference:
        condition: service_healthy

  clip-validator:
    build:
      context: ./services/clip-validator
      dockerfile: Dockerfile
    container_name: agroguard-clip-validator
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      CLIP_THRESHOLD_PLANT: "0.30"
      CLIP_THRESHOLD_NO_PLANT: "0.70"
      CLIP_THRESHOLD_UNSUPPORTED_CROP: "0.60"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ensemble-inference:
    build:
      context: ./services/ensemble-inference
      dockerfile: Dockerfile
    container_name: agroguard-ensemble-inference
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MODEL_ROOT: /models
    volumes:
      - ./agroguard_modelos_completos:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  mongo:
    image: mongo:7.0
    container_name: agroguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agroguard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local
